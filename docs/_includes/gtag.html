{% comment %}
  Overrides the theme's gtag.html: Google Analytics is loaded only after the visitor's
  consent (Google Consent Mode v2, basic mode). Everything starts denied; the banner and
  the loading of gtag.js are in /assets/js/consent.js.
{% endcomment %}
{% if site.gtag %}
<script>
  window.dataLayer = window.dataLayer || [];
  function gtag(){dataLayer.push(arguments);}
  gtag('consent', 'default', {
    ad_storage: 'denied',
    ad_user_data: 'denied',
    ad_personalization: 'denied',
    analytics_storage: 'denied'
  });
  window.GA_MEASUREMENT_ID = '{{ site.gtag }}';
  window.PRIVACY_URL = '{{ "/privacy/" | relative_url }}';
</script>
<script defer src="{{ '/assets/js/consent.js' | relative_url }}"></script>
{% endif %}
